server {
    listen 80;
    server_name zerynecommerce.kro.kr api.zeryn.kro.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 307 https://$host$request_uri;
    }
}
